# Production configuration for GitHub Pages
# Use this when building for production: hugo --config hugo.production.toml

baseURL = "https://luis-serrano-l.github.io/decarta-site/"
languageCode = "en-us"
title = "Dynamic Restaurant Menu"

# Enable features
enableRobotsTXT = true
enableGitInfo = true
enableEmoji = true
# The site has no taxonomies or feeds.
disableKinds = ["taxonomy", "term", "rss"]

# Build settings
minify = true  # Minify for production
buildDrafts = false
buildFuture = false

# Menu configuration
[params]
  menuTitle = "Our Menu"
  restaurantName = "Delicious Restaurant"
  tagline = "Fresh ingredients, amazing flavors"
  # Menu prices carry no currency; the site puts this symbol before them.
  currencySymbol = "$"
  # User menus are published by decarta-bot to static/menus/<id>.json in this
  # repository and served from /menus/<id>.json; no API URL is needed.

[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "Menu"
    url = "/menu/"
    weight = 2

