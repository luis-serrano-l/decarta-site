# Production configuration for GitHub Pages
# Use this when building for production: hugo --config hugo.production.toml

baseURL = "https://luis-serrano-l.github.io/demenu-site/"
languageCode = "en-us"
title = "Dynamic Restaurant Menu"

# Enable features
enableRobotsTXT = true
enableGitInfo = true
enableEmoji = true

# Build settings
minify = true  # Minify for production
buildDrafts = false
buildFuture = false

# Menu configuration
[params]
  menuTitle = "Our Menu"
  restaurantName = "Delicious Restaurant"
  tagline = "Fresh ingredients, amazing flavors"
  # User menus are published by demenu_bot to static/menus/<id>.json in this
  # repository and served from /menus/<id>.json; no API URL is needed.

[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "Menu"
    url = "/menu/"
    weight = 2

